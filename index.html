<style>
/* HORBACH CI: FreshGreen #b4c800 · Basil #697d0f · Amber #ecbd00 · Indigo #006e96 · Berry #af005f · WarmGrey #827869 */
*{box-sizing:border-box}
body{margin:0;background:#f4f1ec;font-family:Assistant,sans-serif;color:#2b2723}
.stage{width:1280px;margin:0 auto;position:relative;overflow:hidden;background:#fff;transform-origin:top left}
[data-p]{fill:#d9d3cb} /* Grundfarbe vor JS, sonst blitzt der Schirm beim Laden schwarz */
.panel{fill:#d9d3cb;stroke:#fff;stroke-width:1.4;transition:fill .8s ease}
.panel.on.pa{fill:#697d0f}.panel.on.pb{fill:#b4c800}
.tear{opacity:1;transition:opacity .6s ease}.tear.off{opacity:0}
.pnum{font:700 22px Assistant,sans-serif;fill:#6b6259;transition:fill .6s ease}.pnum.on{fill:#fff}
.lane{position:absolute;top:0;width:2px;pointer-events:none}
.drop{position:absolute;left:0;top:-30px;width:2px;height:16px;border-radius:2px;background:rgba(0,110,150,.5);transform-origin:50% 100%;animation:fall linear infinite}
.drop.leak{background:rgba(175,0,95,.72)}
@keyframes fall{0%{top:-30px;opacity:0;transform:scale(1,1)}8%{opacity:1}86%{top:calc(100% - 16px);opacity:1;transform:scale(1,1)}100%{top:calc(100% - 16px);opacity:0;transform:scale(4,.15)}}
.chip{position:relative;display:flex;align-items:center;gap:12px;min-height:84px;padding:30px 14px 12px;border-radius:12px;border:1.5px solid #e3ded7;background:#fff;font-family:inherit;text-align:left;cursor:pointer;transition:border-color .4s,background-color .4s}
.chip:hover{border-color:#827869}
.chip:focus-visible,.btn:focus-visible{outline:3px solid #006e96;outline-offset:2px}
.chip .num{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#5d554c;background:#eeeae4;transition:background-color .4s,color .4s}
.chip.on{border-color:#697d0f;background:#f6f8e6}.chip.on .num{background:#697d0f;color:#fff}
.chip>span:nth-child(2){flex:1;min-width:0}
.chip .t{display:block;font-weight:700;font-size:16px;line-height:1.2;color:#2b2723}
.chip .r{display:block;font-size:14px;line-height:1.3;color:#5d554c;margin-top:2px}
.chip .pill{position:absolute;top:10px;right:12px;white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;color:#af005f;background:#f8e7ef}
.chip.on .pill{color:#fff;background:#697d0f}
.chip .grp{position:absolute;top:11px;left:14px;font-size:12px;font-weight:700;color:#006e96}
.chip.addon{border-style:dashed}.chip.addon .pill{color:#5d554c;background:#eeeae4}
.chip.addon.on{border-style:solid;border-color:#006e96;background:#e9f2f6}
.chip.addon.on .num,.chip.addon.on .pill{background:#006e96;color:#fff}
/* Info-Knopf sitzt neben (nicht in) der Kachel, weil Buttons nicht verschachtelt werden dürfen */
.cell{position:relative;display:flex}.cell>.chip{flex:1;padding-right:48px}
.info{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:50%;border:1.5px solid #cfc8bf;background:#fff;color:#5d554c;font:italic 700 16px Georgia,serif;cursor:pointer}
.info:hover{border-color:#827869;color:#2b2723}.info:focus-visible{outline:3px solid #006e96;outline-offset:2px}
#infoDlg{width:min(560px,94vw)}#infoDlg .dlg-b{background:#fff;border-top:0}#infoDlg h3{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#697d0f}
#infoDlg p{margin:0 0 16px;font-size:16px;line-height:1.5}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 18px;border-radius:10px;font:700 15px Assistant,sans-serif;cursor:pointer}
.btn.primary{background:#006e96;color:#fff;border:none}.btn.primary:hover{background:#005a7b}
.btn.ghost{background:#fff;color:#2b2723;border:1.5px solid #cfc8bf}.btn.ghost:hover{border-color:#827869}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
#badge{display:none}
.seg{display:flex;gap:4px;padding:4px;border-radius:10px;background:#eeeae4}
.seg button{flex:1;min-height:48px;border:0;border-radius:8px;background:transparent;font:700 15px Assistant,sans-serif;color:#5d554c;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:#2b2723;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:3px solid #006e96;outline-offset:2px}
dialog{width:min(900px,94vw);max-height:92vh;border:0;border-radius:16px;padding:0;font-family:Assistant,sans-serif;color:#2b2723;background:#f4f1ec}
dialog::backdrop{background:rgba(43,39,35,.5)}
.dlg-h{padding:22px 24px 16px;background:#fff;border-bottom:1.5px solid #e3ded7}.dlg-h h2{margin:0;font-size:24px;font-weight:800}.dlg-h p{margin:4px 0 0;font-size:14px;color:#5d554c}
.dlg-b{padding:18px 24px 4px;overflow:auto;max-height:calc(92vh - 190px)}
.dlg-f{padding:14px 24px;display:flex;justify-content:flex-end;gap:10px;background:#fff;border-top:1.5px solid #e3ded7}
/* Jede Gruppe als Kachel wie auf der Hauptseite */
fieldset{margin:0 0 16px;padding:16px 18px 18px;border:1.5px solid #e3ded7;border-radius:12px;background:#fff}
legend{float:left;width:100%;padding:0;margin-bottom:12px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#697d0f}
.fgrid{clear:both;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fgrid label,.fgrid .field{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font-size:13px;font-weight:600;color:#5d554c}
.fgrid .wide{grid-column:1/-1}
.fgrid input,.fgrid select,.fgrid textarea{font:400 15px Assistant,sans-serif;color:#2b2723;min-height:44px;padding:8px 10px;border:1.5px solid #cfc8bf;border-radius:8px;background:#faf8f5}
.fgrid input:focus,.fgrid textarea:focus{background:#fff;border-color:#827869}
.fgrid input:focus-visible,.fgrid select:focus-visible,.fgrid textarea:focus-visible{outline:3px solid #006e96;outline-offset:1px}
[hidden]{display:none!important}
/* Auswahlfelder als Kacheln */
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.fgrid .tile{position:relative;flex:1 1 0;min-width:max-content;flex-direction:row;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border:1.5px solid #e3ded7;border-radius:10px;background:#fff;font-size:14px;font-weight:700;color:#2b2723;cursor:pointer;transition:border-color .3s,background-color .3s}
.fgrid .tile:hover{border-color:#827869}
.tile input{position:absolute;opacity:0;pointer-events:none}
.fgrid .tile:has(input:checked){border-color:#697d0f;background:#f6f8e6;color:#3f4a09}
.tile:has(input:focus-visible){outline:3px solid #006e96;outline-offset:2px}
.toggle{clear:both;position:relative;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border:1.5px dashed #cfc8bf;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:border-color .3s,background-color .3s}
.toggle:hover{border-color:#827869}
.toggle:has(input:checked){border-style:solid;border-color:#006e96;background:#e9f2f6;margin-bottom:14px}
.toggle input{width:22px;height:22px;accent-color:#006e96}
.fgrid .sub{grid-column:1/-1;margin-top:8px;padding:8px 12px;border-radius:8px;background:#f4f1ec;font-size:14px;font-weight:700;color:#2b2723}
.fgrid .hint{grid-column:1/-1;margin:0;padding:10px 12px;border-radius:8px;border:1.5px solid #ecbd00;background:#fdf6d8;font-size:14px;line-height:1.4;color:#2b2723}
.fgrid input.sum{background:#f6f8e6;border-color:#d6dda6;font-weight:700;color:#3f4a09}
@media (prefers-reduced-motion:reduce){.fgrid .tile,.toggle{transition:none}}
#sheet{display:none}
@page{margin:16mm}
@media print{
  .stage,dialog{display:none!important}
  body{background:#fff;height:auto!important}
  #sheet{display:block;font-size:13px;color:#2b2723}
  #sheet h1{font-size:22px;margin:0 0 2px}#sheet h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#697d0f;margin:18px 0 6px}
  #sheet table{width:100%;border-collapse:collapse}#sheet td{padding:5px 8px;border-bottom:1px solid #e3ded7;vertical-align:top}
  #sheet td:first-child{width:38%;color:#5d554c}
  #sheet tr.sub td{padding-top:12px;font-weight:700;color:#2b2723}
}
.fade{transition:opacity .9s ease,transform .9s ease}
#rain{transition:opacity .9s ease}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.drop{animation:none;opacity:0}.rays{animation:none}.panel,.tear,.pnum,.chip,.chip .num,.fade,#rain{transition:none}}
</style>
</head>

    ],
    privat: [
      ['Person', [['Name', 'text'], ['Geburtsdatum', 'date'],
        ['Familienstand', 'select', ['ledig', 'verheiratet / Partnerschaft', 'geschieden', 'verwitwet']],
        ['Kinder (Anzahl)', 'number'], ['PLZ / Ort', 'text'],
        ['Berufsstatus', 'select', ['niedergelassen', 'angestellt', 'in Weiterbildung', 'Studium']]]],
      ['Absicherung', [['Fachrichtung', 'text'], ['Bruttoeinkommen pro Jahr (€)', 'number'], ['Gewünschte BU-Rente pro Monat (€)', 'number'],
        ['Krankenversicherung', 'select', ['GKV', 'PKV']], ['Raucher', 'select', JN]]],
      ['Sonstiges', [['Bestehende Verträge / Ablauf', 'textarea'], ['Bemerkungen', 'textarea']]]
    ]
  };
  var covered = state[mode].covered, addons = state[mode].addons;

  var $ = function (s) { return document.querySelector(s); };
  var panels = [], tears = [], nums = [];
  for (var i = 0; i < N; i++) {
    panels.push(document.querySelector('[data-p="' + i + '"]'));
    tears.push(document.querySelector('[data-t="' + i + '"]'));
    nums.push(document.querySelector('[data-n="' + i + '"]'));
    panels[i].classList.add('panel', i % 2 ? 'pb' : 'pa');
    tears[i].classList.add('tear');
    nums[i].classList.add('pnum');
  }

  var rain = $('#rain');
  var drops = DROPS.map(function (d) {
    var lane = document.createElement('div');
    lane.className = 'lane';
    lane.style.left = (d[1] - 1) + 'px';
    var drop = document.createElement('div');
    drop.className = 'drop';
    drop.style.animationDuration = d[5] + 'ms';
    drop.style.animationDelay = '-' + d[4] + 'ms';
    lane.appendChild(drop);
    rain.appendChild(lane);
    return { d: d, lane: lane, drop: drop };
  });

  function chip(n, title, risk, extraCls, grp) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (extraCls || '');
    b.innerHTML = '<span class="num"></span><span><span class="t"></span><span class="r"></span></span><span class="pill"></span>';
    b.querySelector('.num').textContent = n;
    b.querySelector('.t').textContent = title;
    b.querySelector('.r').textContent = risk;
    if (grp) { var g = document.createElement('span'); g.className = 'grp'; g.textContent = grp; b.appendChild(g); }
    return b;
  }
  // Kachel + Info-Knopf als Geschwister in einer Zelle
  function cell(b, it) {
    var c = el('div', null, 'cell'), i = el('button', 'i', 'info');
    i.type = 'button';
    i.setAttribute('aria-label', 'Info: ' + it[0]);
    i.addEventListener('click', function () {
      $('#infoTitle').textContent = it[2] ? 'Betriebsunterbrechung – ' + it[0] : it[0];
      $('#infoRisk').textContent = it[1];
      $('#infoWhy').textContent = INFO[it[0]][0];
      $('#infoCore').textContent = INFO[it[0]][1];
      $('#infoDlg').showModal();
    });
    c.appendChild(b); c.appendChild(i);
    return c;
  }
  var coreChips = [], addonChips = [];
  function setMode(m) {
    mode = m; M = MODES[m]; covered = state[m].covered; addons = state[m].addons;
    coreChips.concat(addonChips).forEach(function (b) { b.parentNode.remove(); });
    coreChips = M.items.map(function (it, idx) {
      var b = chip(idx + 1, it[0], it[1], '', it[2]);
      b.addEventListener('click', function () { covered[idx] = !covered[idx]; render(); });
      $('#core').appendChild(cell(b, it));
      return b;
    });
    addonChips = M.addons.map(function (it, idx) {
      var b = chip('+', it[0], it[1], ' addon');
      b.addEventListener('click', function () { addons[idx] = !addons[idx]; render(); });
      $('#extra').appendChild(cell(b, it));
      return b;
    });
    ['eyebrow', 'title', 'lead', 'foot'].forEach(function (k) { $('#' + k).textContent = M[k]; });
    $('#extra').hidden = !M.addons.length;
    for (var p = 0; p < N; p++) {
      var hid = M.hide.indexOf(p) > -1;
      tears[p].style.display = nums[p].style.display = hid ? 'none' : '';
      nums[p].textContent = M.seg[p] + 1;
      panels[p].classList.toggle('pb', M.seg[p] % 2 === 1); // Farbe je Baustein, nicht je Segment
      panels[p].classList.toggle('pa', M.seg[p] % 2 === 0);
    }
    $('#praxisBld').style.display = m === 'praxis' ? '' : 'none';
    $('#homeBld').style.display = m === 'privat' ? '' : 'none';
    $('#scene').setAttribute('aria-label', M.aria);
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.mode === m); });
    render();
  }
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.mode); });
  });

  function render() {
    for (var p = 0; p < N; p++) {
      var on = covered[M.seg[p]];
      panels[p].classList.toggle('on', on);
      tears[p].classList.toggle('off', on);
      nums[p].classList.toggle('on', on);
    }
    for (var i = 0; i < coreChips.length; i++) {
      coreChips[i].classList.toggle('on', covered[i]);
      coreChips[i].setAttribute('aria-pressed', covered[i]);
      coreChips[i].querySelector('.pill').textContent = covered[i] ? 'Abgesichert' : 'Lücke';
    }
    addonChips.forEach(function (b, i) {
      b.classList.toggle('on', addons[i]);
      b.setAttribute('aria-pressed', addons[i]);
      b.querySelector('.pill').textContent = addons[i] ? 'Ergänzt' : 'Optional';
    });
    drops.forEach(function (o) {
      var d = o.d, open = d[0] < 0 || !covered[M.seg[d[0]]];
      // Privat: Tropfen treffen Kopf (±18) oder Schultern (±34) des Arztes, sonst den Boden
      var dx = Math.abs(d[1] - 668);
      var floor = mode === 'privat' && d[3] === 462 ? (dx < 18 ? 468 : dx < 34 ? 520 : 646) : d[3];
      o.lane.style.height = (open ? floor : d[2]) + 'px';
      o.drop.classList.toggle('leak', d[0] >= 0 && open);
    });
    $('#badge').style.display = covered.every(Boolean) ? 'flex' : 'none';
    // Je mehr abgesichert, desto mehr Sonne: Wolke zieht ab, Regen lässt nach, bei 100 % ist er weg
    var pct = covered.filter(Boolean).length / covered.length;
    $('#sun').style.opacity = .25 + .75 * pct;
    $('#cloud').style.opacity = 1 - pct;
    $('#cloud').style.transform = 'translateX(' + (-140 * pct) + 'px)';
    rain.style.opacity = pct === 1 ? 0 : 1 - .7 * pct;
  }


  // Auf Fenster skalieren, damit Schirm und Kacheln gleichzeitig sichtbar sind
  function fit() {
    var st = $('#stage'), s = Math.min(1, window.innerWidth / 1280, window.innerHeight / st.offsetHeight);
    st.style.transform = s < 1 ? 'scale(' + s + ')' : '';
    st.style.marginLeft = s < 1 ? Math.max(0, (window.innerWidth - 1280 * s) / 2) + 'px' : 'auto';
    document.body.style.height = s < 1 ? (st.offsetHeight * s) + 'px' : '';
  }
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  var dlg = $('#dlg'), capForm = $('#capForm');
  function openCapture() {
    var vals = state[mode].form;
    capForm.innerHTML = '';
    $('#dlgTitle').textContent = 'Daten für Angebot – ' + (mode === 'praxis' ? 'Praxis' : 'Privat');
    sumFields = [];
    FORM[mode].forEach(function (g) {
      var fs = el('fieldset'), grid = el('div', null, 'fgrid'), opt = g[2];
      fs.appendChild(el('legend', g[0]));
      if (opt) { // aufklappbarer Bereich, nur bei Anwahl sichtbar
        var tl = el('label', null, 'toggle'), cb = el('input');
        cb.type = 'checkbox'; cb.name = opt.key; cb.checked = !!vals[opt.key];
        tl.appendChild(cb); tl.appendChild(document.createTextNode(opt.toggle));
        fs.appendChild(tl);
        grid.id = opt.key; grid.hidden = !cb.checked;
        grid.appendChild(el('p', opt.hint, 'hint'));
      }
      g[1].forEach(function (f) {
        if (f[1] === 'sub') { grid.appendChild(el('div', f[0], 'sub')); return; }
        if (f[1] === 'select') { // Auswahl als antippbare Kacheln statt Dropdown
          var fd = el('div', null, 'field' + (f[2].length > 2 ? ' wide' : '')), tiles = el('div', null, 'tiles');
          fd.appendChild(el('span', f[0]));
          tiles.setAttribute('role', 'radiogroup'); tiles.setAttribute('aria-label', f[0]);
          f[2].forEach(function (o) {
            var tl = el('label', null, 'tile'), r = el('input');
            r.type = 'radio'; r.name = f[0]; r.value = o; r.checked = vals[f[0]] === o;
            tl.appendChild(r); tl.appendChild(document.createTextNode(o));
            tiles.appendChild(tl);
          });
          fd.appendChild(tiles); grid.appendChild(fd);
          return;
        }
        var l = el('label', f[0], f[1] === 'textarea' ? 'wide' : ''), input;
        if (f[1] === 'sum') {
          input = el('input', null, 'sum'); input.readOnly = true; input.tabIndex = -1;
          sumFields.push({ input: input, f: f });
        } else if (f[1] === 'textarea') {
          input = el('textarea'); input.rows = 3;
        } else {
          input = el('input'); input.type = f[1];
          if (f[1] === 'number') { input.min = 0; input.step = 'any'; input.inputMode = 'decimal'; }
        }
        input.name = f[0];
        if (f[1] !== 'sum') input.value = vals[f[0]] || '';
        l.appendChild(input);
        grid.appendChild(l);
      });
      fs.appendChild(grid);
      capForm.appendChild(fs);
    });
    updateSums();
    dlg.showModal();
  }
  var sumFields = [];
  function eur(v) { return Number(v).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' €'; }
  function updateSums() {
    var vals = state[mode].form;
    sumFields.forEach(function (s) {
      var v = s.f[2].reduce(function (a, n) { return a + (parseFloat(vals[n]) || 0); }, 0);
      vals[s.f[0]] = v ? String(v) : '';
      s.input.value = v ? eur(v) : '';
    });
  }
  function onInput(e) {
    var t = e.target, vals = state[mode].form;
    if (t.type === 'checkbox') { vals[t.name] = t.checked ? 'ja' : ''; $('#' + t.name).hidden = !t.checked; }
    else vals[t.name] = t.value;
    updateSums();
  }
  capForm.addEventListener('input', onInput);
  capForm.addEventListener('change', onInput); // ältere iPad-Safari melden Checkboxen nur per change
  $('#capture').addEventListener('click', openCapture);
  $('#dlgClose').addEventListener('click', function () { dlg.close(); });
  $('#infoClose').addEventListener('click', function () { $('#infoDlg').close(); });

  function row(t, k, v) { var tr = el('tr'); tr.appendChild(el('td', k)); tr.appendChild(el('td', v)); return t.appendChild(tr); }
  function buildSheet() {
    var s = $('#sheet'), vals = state[mode].form, t;
    s.innerHTML = '';
    s.appendChild(el('h1', 'Datenaufnahme Versicherungsangebot – ' + (mode === 'praxis' ? 'Praxis' : 'Privat')));
    s.appendChild(el('div', 'Stand ' + new Date().toLocaleDateString('de-DE') + ' · Sebastian Klinder · Finanz- & Niederlassungsberatung · HORBACH'));
    FORM[mode].forEach(function (g) {
      if (g[2] && !vals[g[2].key]) return; // nicht angewählter Bereich kommt nicht aufs Blatt
      s.appendChild(el('h2', g[0]));
      t = s.appendChild(el('table'));
      if (g[2]) row(t, 'Hinweis', g[2].hint);
      g[1].forEach(function (f) {
        if (f[1] === 'sub') { row(t, f[0], '').className = 'sub'; return; }
        var v = vals[f[0]];
        row(t, f[0], !v ? '–' : f[0].indexOf('(€)') > -1 ? eur(v) : v);
      });
    });
    s.appendChild(el('h2', 'Versicherungsschirm'));
    t = s.appendChild(el('table'));
    var names = function (on) { return M.items.filter(function (_, i) { return covered[i] === on; }).map(function (it) { return it[2] ? 'BU ' + it[0] : it[0]; }).join(', ') || '–'; };
    row(t, 'Bereits abgesichert', names(true));
    row(t, 'Lücken – anzubieten', names(false));
    row(t, 'Optionale Zusätze gewünscht', M.addons.filter(function (_, i) { return addons[i]; }).map(function (a) { return a[0]; }).join(', ') || '–');
  }
  $('#dlgPrint').addEventListener('click', function () { buildSheet(); window.print(); });

  setMode('praxis');
  window.addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
